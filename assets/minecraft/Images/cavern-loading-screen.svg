<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#5A467C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5A467C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="20%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#5A467C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#5A467C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="30%">
      <stop offset="0%" stop-color="#E8E4F0" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#E8E4F0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#5A467C" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="gridMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="60%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridFade">
      <rect width="1280" height="720" fill="url(#gridMask)"/>
    </mask>
  </defs>

  <!-- Base -->
  <rect width="1280" height="720" fill="#07070a"/>

  <!-- Grid -->
  <rect width="1280" height="720" fill="url(#grid)" mask="url(#gridFade)"/>

  <!-- Atmospheric glows -->
  <rect width="1280" height="720" fill="url(#bgGlow)"/>
  <rect width="1280" height="720" fill="url(#bgGlow2)"/>
  <rect width="1280" height="720" fill="url(#centerGlow)"/>

  <!-- Stalactite silhouettes -->
  <path d="M0 720 L0 300 C60 300 75 480 105 480 C135 480 150 240 185 240 C220 240 230 420 265 420 C300 420 315 160 360 160 C405 160 415 400 455 400 C495 400 510 280 550 280 C590 280 600 460 640 460 C680 460 695 200 740 200 C785 200 795 420 835 420 C875 420 890 300 930 300 C970 300 980 500 1020 500 C1060 500 1075 240 1115 240 C1155 240 1165 440 1205 440 C1245 440 1255 320 1280 320 L1280 720 Z"
        fill="#5A467C" fill-opacity="0.055"/>

  <path d="M0 720 L0 420 C40 420 55 580 80 580 C105 580 120 380 150 380 C180 380 195 540 230 540 C265 540 280 440 320 440 C360 440 375 600 415 600 C455 600 470 460 510 460 C550 460 565 560 605 560 C645 560 660 420 700 420 C740 420 755 580 795 580 C835 580 850 460 890 460 C930 460 945 560 985 560 C1025 560 1040 440 1080 440 C1120 440 1135 600 1175 600 C1215 600 1230 500 1280 500 L1280 720 Z"
        fill="#5A467C" fill-opacity="0.035"/>

  <!-- Corner brackets -->
  <path d="M32 32 L32 56 M32 32 L56 32" stroke="#5A467C" stroke-width="1.2" stroke-opacity="0.35" fill="none"/>
  <path d="M1248 688 L1248 664 M1248 688 L1224 688" stroke="#5A467C" stroke-width="1.2" stroke-opacity="0.35" fill="none"/>
  <path d="M1248 32 L1248 56 M1248 32 L1224 32" stroke="#5A467C" stroke-width="1.2" stroke-opacity="0.2" fill="none"/>
  <path d="M32 688 L32 664 M32 688 L56 688" stroke="#5A467C" stroke-width="1.2" stroke-opacity="0.2" fill="none"/>

  <!-- Center mark -->
  <g transform="translate(614, 248)">
    <path d="M8 62 C8 36 17 16 24 13 C31 16 40 36 40 62"
          stroke="#5A467C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M15 62 C15 42 19 26 24 22 C29 26 33 42 33 62"
          stroke="#5A467C" stroke-width="1" fill="none" stroke-opacity="0.45" stroke-linecap="round"/>
    <line x1="24" y1="13" x2="24" y2="6" stroke="#5A467C" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="24" cy="4.5" r="2" fill="#5A467C"/>
    <line x1="8" y1="62" x2="2" y2="62" stroke="#5A467C" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="40" y1="62" x2="46" y2="62" stroke="#5A467C" stroke-width="1" stroke-opacity="0.4"/>
  </g>

  <!-- Title -->
  <text x="640" y="370"
        font-family="'Cormorant Garamond', 'Georgia', serif"
        font-weight="300"
        font-size="72"
        letter-spacing="20"
        text-anchor="middle"
        fill="#E8E4F0">CAVERN</text>

  <!-- Subtitle -->
  <text x="640" y="396"
        font-family="'Syne', 'Arial', sans-serif"
        font-weight="700"
        font-size="10"
        letter-spacing="5"
        text-anchor="middle"
        fill="#5A467C">DARK CAVERN COMMUNITY</text>

  <!-- Progress bar track -->
  <rect x="540" y="440" width="200" height="1" fill="#5A467C" fill-opacity="0.2"/>
  <!-- Progress bar fill (shown at ~40% for preview) -->
  <rect x="540" y="440" width="80" height="1" fill="#5A467C" fill-opacity="0.8"/>

  <!-- Status text -->
  <text x="640" y="460"
        font-family="'Syne', 'Arial', sans-serif"
        font-weight="400"
        font-size="9"
        letter-spacing="2"
        text-anchor="middle"
        fill="#E8E4F0" fill-opacity="0.25">Loading shaders...</text>

  <!-- Version -->
  <text x="1248" y="700"
        font-family="'Syne', 'Arial', sans-serif"
        font-weight="700"
        font-size="9"
        letter-spacing="2"
        text-anchor="end"
        fill="#E8E4F0" fill-opacity="0.15">v1.0.0</text>
</svg>
