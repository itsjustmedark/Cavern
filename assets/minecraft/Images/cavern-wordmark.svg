<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&amp;display=swap');
    </style>
  </defs>

  <!-- Mark -->
  <g transform="translate(8, 8)">
    <!-- Outer arch -->
    <path d="M8 56 C8 32 16 14 24 12 C32 14 40 32 40 56"
