<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">

  <!-- Background tile (optional, remove for transparent) -->
  <rect width="96" height="96" fill="#0a0a0c" rx="18"/>

  <!-- Subtle bg glow -->
  <radialGradient id="glow" cx="50%" cy="80%" r="60%">
    <stop offset="0%" stop-color="#5A467C" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#5A467C" stop-opacity="0"/>
  </radialGradient>
  <rect width="96" height="96" fill="url(#glow)" rx="18"/>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="95" height="95" fill="none"
        stroke="#5A467C" stroke-width="1" stroke-opacity="0.3" rx="18"/>

  <!-- Mark, centered -->
  <g transform="translate(24, 14)">
    <!-- Outer arch -->
    <path d="M8 62 C8 36 17 16 24 13 C31 16 40 36 40 62"
          stroke="#5A467C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- Inner arch -->
    <path d="M15 62 C15 42 19 26 24 22 C29 26 33 42 33 62"
          stroke="#5A467C" stroke-width="1" fill="none" stroke-opacity="0.5" stroke-linecap="round"/>
    <!-- Drop -->
    <line x1="24" y1="13" x2="24" y2="6" stroke="#5A467C" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="24" cy="4.5" r="2" fill="#5A467C"/>
    <!-- Side accents -->
    <line x1="8" y1="62" x2="2" y2="62" stroke="#5A467C" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="40" y1="62" x2="46" y2="62" stroke="#5A467C" stroke-width="1" stroke-opacity="0.4"/>
  </g>
</svg>
